{% extends "base.html" %}

{% block title %}Sign In — MMA Fighting Platform{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="card-title h3 mb-4 text-center">Sign In</h1>

                    {% if error %}
                        <div class="alert alert-danger" role="alert">
                            {{ error }}
                        </div>
                    {% endif %}

                    <form method="post" novalidate>
                        {% csrf_token %}

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="id_email" class="form-label fw-semibold">
                                Email address
                            </label>
                            <input
                                type="email"
                                id="id_email"
                                name="email"
                                value="{{ request.POST.email|default:'' }}"
                                class="form-control"
                                autocomplete="email"
                                required
                                style="min-height: 44px;"
                            >
                        </div>

                        <!-- Password -->
                        <div class="mb-4">
                            <label for="id_password" class="form-label fw-semibold">
                                Password
                            </label>
                            <input
                                type="password"
                                id="id_password"
                                name="password"
                                class="form-control"
                                autocomplete="current-password"
                                required
                                style="min-height: 44px;"
                            >
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary py-2 px-4" style="min-height: 44px;">
                                Sign In
                            </button>
                        </div>
                    </form>

                    <hr class="my-4">
                    <p class="text-center mb-0">
                        Don't have an account?
                        <a href="/accounts/register/">Create one</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

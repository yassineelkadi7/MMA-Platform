{% extends "base.html" %}
{% load static %}

{% block title %}Training Stopwatch — MMA Fighting Platform{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6">

            <h1 class="h2 mb-4 text-center">Training Stopwatch</h1>

            <div class="card shadow-sm">
                <div class="card-body text-center p-4">

                    <!-- MM:SS.T display -->
                    <div
                        id="stopwatch-display"
                        class="display-1 font-monospace mb-4"
                        aria-live="polite"
                        aria-atomic="true"
                        aria-label="Elapsed time"
                    >00:00.0</div>

                    <!-- Controls -->
                    <div class="d-flex justify-content-center gap-3 flex-wrap">
                        <button
                            id="btn-start"
                            class="btn btn-success px-4"
                            style="min-height: 44px; min-width: 44px;"
                            aria-label="Start stopwatch"
                        >
                            Start
                        </button>
                        <button
                            id="btn-stop"
                            class="btn btn-warning px-4"
                            style="min-height: 44px; min-width: 44px;"
                            aria-label="Stop stopwatch"
                        >
                            Stop
                        </button>
                        <button
                            id="btn-reset"
                            class="btn btn-secondary px-4"
                            style="min-height: 44px; min-width: 44px;"
                            aria-label="Reset stopwatch"
                        >
                            Reset
                        </button>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/stopwatch.js' %}"></script>
{% endblock %}
